version: '3.7'

services:

  rabbitmq:
    image: rabbitmq:3.8
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASSWORD: guest
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_SSL_CACERTFILE: /rootCA.pem
      RABBITMQ_SSL_CERTFILE: /rootCA.pem
      RABBITMQ_SSL_KEYFILE: /rootCA.key
      RABBITMQ_SSL_VERIFY: verify_none
      RABBITMQ_SSL_FAIL_IF_NO_PEER_CERT: "false"
    volumes:
      - "./tests/files/rootCA.pem:/rootCA.pem:ro"
      - "./tests/files/rootCA.key:/rootCA.key:ro"
    ports:
      - "15671:15671"
      - "15672:15672"
      - "5671:5671"
      - "5672:5672"

  # AMQProxy with an unreachable upstream: it accepts the client connection and fails every channel.open
  # with UPSTREAM_ERROR, as in production while the broker behind the proxy is down or restarting.
  amqproxy-upstream-down:
    image: cloudamqp/amqproxy:3.2.2
    # Not AMQProxy's default port 5673, so the tests never reach a real proxy someone runs locally.
    command: ["--listen=0.0.0.0", "--port=5679", "amqp://127.0.0.1:1"]
    ports:
      - "5679:5679"

  rabbitmq-management:
    image: rabbitmq:management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASSWORD: guest
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_MANAGEMENT_SSL_CACERTFILE: /rootCA.pem
      RABBITMQ_MANAGEMENT_SSL_CERTFILE: /rootCA.pem
      RABBITMQ_MANAGEMENT_SSL_KEYFILE: /rootCA.key
      RABBITMQ_MANAGEMENT_SSL_VERIFY: verify_none
      RABBITMQ_MANAGEMENT_SSL_FAIL_IF_NO_PEER_CERT: "false"
    volumes:
      - "./tests/files/rootCA.pem:/rootCA.pem:ro"
      - "./tests/files/rootCA.key:/rootCA.key:ro"
    ports:
      - 15671:15671
      - 15672:15672
      - 5671:5671
      - 5672:5672
