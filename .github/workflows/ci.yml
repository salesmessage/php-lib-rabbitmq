name: Tests

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
        laravel: ['^12.0']

    services:
      rabbitmq:
        image: rabbitmq:4.3.1
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pcntl, sockets
          coverage: none

      - name: Start AMQProxy with an unreachable upstream
        run: |
          docker run -d --name amqproxy-upstream-down -p 5679:5679 \
            cloudamqp/amqproxy:3.2.2 --listen=0.0.0.0 --port=5679 amqp://127.0.0.1:1
          for attempt in $(seq 1 30); do
            nc -z 127.0.0.1 5679 && exit 0
            sleep 1
          done
          docker logs amqproxy-upstream-down
          exit 1

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer update --with="laravel/framework:${{ matrix.laravel }}" --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --testsuite Unit,Broker
